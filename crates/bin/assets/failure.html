<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark">
<title>DeepSeek Harness — 启动失败</title>
<style>
  :root { color-scheme: dark; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; align-items: center; justify-content: center;
    background: #16171a; color: #e6e6e6;
    font-family: "Inter", "Noto Sans CJK SC", system-ui, sans-serif;
    font-size: 13px; line-height: 1.6;
  }
  main { width: min(760px, 88vw); display: flex; flex-direction: column; gap: 16px; }
  .head { display: flex; align-items: center; gap: 10px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #f24822; flex: none; }
  h1 { font-size: 15px; font-weight: 600; margin: 0; }
  .summary { color: #cfcfd4; margin: 0; }
  pre {
    margin: 0; padding: 14px 16px; max-height: 40vh; overflow: auto;
    background: #1d1e22; border: 1px solid #2e2f35; border-radius: 8px;
    font-family: ui-monospace, "JetBrains Mono", monospace; font-size: 12px;
    color: #b9bac1; white-space: pre-wrap; word-break: break-word;
    user-select: text;
  }
  .actions { display: flex; gap: 10px; }
  button {
    font: inherit; padding: 8px 14px; border-radius: 6px; cursor: pointer;
    border: 1px solid #34353c; background: #232428; color: #e6e6e6;
  }
  button:hover { background: #2a2b30; }
  button.primary { background: #0c8ce9; border-color: #0c8ce9; color: #fff; }
  button.primary:hover { background: #0a7fd4; }
  .foot { color: #7c7d85; font-size: 12px; }
</style>
</head>
<body>
<main>
  <div class="head"><span class="dot"></span><h1>本地服务没有启动起来</h1></div>
  <p class="summary" id="summary"></p>
  <pre id="detail"></pre>
  <div class="actions">
    <button class="primary" onclick="send('retry')">重启本地服务</button>
    <button onclick="send('open-logs')">打开日志目录</button>
    <button onclick="send('quit')">退出</button>
  </div>
  <div class="foot">如果反复失败，多半是 dsh 版本与壳不匹配；诊断信息里带着解析到的可执行文件与版本。</div>
</main>
<script>
  function send(cmd) {
    if (window.ipc && window.ipc.postMessage) window.ipc.postMessage(cmd);
  }
</script>
</body>
</html>
