<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark">
<title>DeepSeek Harness</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; align-items: center; justify-content: center;
    background: #16171a; color: #e6e6e6;
    font-family: "Inter", "Noto Sans CJK SC", system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 13px; line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    user-select: none;
  }
  main { display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .mark { width: 34px; height: 34px; border-radius: 9px; background: #2a2b30; position: relative; overflow: hidden; }
  .mark::after {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(110deg, transparent 20%, #3d3f46 45%, transparent 70%);
    transform: translateX(-100%);
    animation: sweep 1.6s ease-in-out infinite;
  }
  @keyframes sweep { 0% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }
  .title { color: #cfcfd4; letter-spacing: .01em; }
  .hint { color: #7c7d85; font-size: 12px; }
  @media (prefers-reduced-motion: reduce) { .mark::after { animation: none; } }
</style>
</head>
<body>
  <main>
    <div class="mark"></div>
    <div class="title">正在启动本地服务…</div>
    <div class="hint">首次启动需要初始化 profile，通常 1–3 秒</div>
  </main>
</body>
</html>
