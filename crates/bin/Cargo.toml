[package]
name = "dsh-desktop"
description = "Rust desktop shell for DeepSeek Harness (Linux)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "dsh-desktop"
path = "src/main.rs"

[dependencies]
dsh-platform.workspace = true
dsh-setup.workspace = true
dsh-supervisor.workspace = true
global-hotkey = "0.9.0"

arboard = "3.6.1"
base64 = "0.23.1"
libc = "0.2.191"
muda = "0.21.2"
notify-rust = "4.18.2"
png = "0.18.1"
rfd = "0.17.2"
serde_json = "1.0.154"
tao = "0.37.2"
tray-icon = "0.26.1"
wry = "0.57.1"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18.2"
