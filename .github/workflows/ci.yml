name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Linux：完整的 fmt / clippy / test + 真窗口冒烟
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            xvfb xdotool openbox imagemagick python3-pil

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux

      - name: fmt
        run: cargo fmt --all --check

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: test
        run: cargo test --workspace --lib --tests

      - name: smoke (失败页视觉基线)
        run: xvfb-run -a -s "-screen 0 1600x1000x24" bash scripts/smoke.sh

  # macOS / Windows：编译 + 打测试二进制（没有宿主 dsh，跑不了端到端）
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            name: macos-arm64
          - os: windows-2022
            name: windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.name }}

      - name: build
        run: cargo build --workspace --release

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
