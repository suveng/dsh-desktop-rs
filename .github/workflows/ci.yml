name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            xvfb

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci

      - name: fmt
        run: cargo fmt --all --check

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # supervisor / platform 的测试不需要窗口；GUI 冒烟测试留给 M2 的 xvfb job。
      - name: test
        run: cargo test --workspace --lib --tests

  smoke:
    # 真实窗口的冒烟测试：xvfb 里起一个窗口，验证失败页与桌面 shim。
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            xvfb xdotool imagemagick python3-pil

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: smoke

      - name: build
        run: cargo build --workspace

      # 场景 2（真实前端）需要本地 dsh，CI 里没有，所以只跑失败页基线。
      - name: smoke
        run: xvfb-run -a -s "-screen 0 1600x1000x24" bash scripts/smoke.sh
