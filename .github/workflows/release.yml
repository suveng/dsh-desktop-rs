name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # 发布前先跑一遍 Linux 的完整校验：打包出来的东西必须来自通过测试的代码。
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            xvfb xdotool openbox imagemagick python3-pil
      - uses: Swatinem/rust-cache@v2
        with: { shared-key: release-verify }
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --lib --tests
      - name: build
        run: cargo build --workspace

      - name: smoke
        env:
          SMOKE_RELAXED: "1"
        run: xvfb-run -a -s "-screen 0 1600x1000x24" bash scripts/smoke.sh

  linux:
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            python3-pil curl
      - uses: Swatinem/rust-cache@v2
        with: { shared-key: release-linux }
      - name: Package (deb / AppImage / tar.gz)
        run: bash scripts/package.sh
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: dist/*

  macos:
    needs: verify
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with: { shared-key: release-macos }
      - name: Build
        run: cargo build --release -p dsh-desktop
      - name: Bundle .app + zip
        env:
          # 配了 Developer ID 就走真签名 + 公证；没配就 ad-hoc，README 会说明需要右键打开。
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: bash packaging/macos/bundle.sh
      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: dist/*

  windows:
    needs: verify
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with: { shared-key: release-windows }
      - name: Build
        run: cargo build --release -p dsh-desktop
      - name: Install WiX
        run: choco install wixtoolset --no-progress -y

      - name: MSI + zip
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"').Matches[0].Groups[1].Value
          New-Item -ItemType Directory -Force dist, target\wix | Out-Null
          Copy-Item target\release\dsh-desktop.exe target\wix\
          Copy-Item LICENSE target\wix\
          (Get-Content packaging\windows\product.wxs.in -Raw).Replace('@VERSION@', $version) |
            Set-Content -Encoding UTF8 target\wix\product.wxs

          candle.exe -out target\wix\product.wixobj target\wix\product.wxs
          light.exe -out "dist\dsh-desktop-$version-windows-x64.msi" target\wix\product.wixobj

          # 只把真正的发行文件放进 dist，避免把 LICENSE/README/wixpdb 也传成发布附件
          $stage = "target\winzip"
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item target\release\dsh-desktop.exe $stage\
          Copy-Item LICENSE, README.md $stage\
          Compress-Archive -Path "$stage\*" -DestinationPath "dist\dsh-desktop-$version-windows-x64.zip" -Force
          Get-ChildItem dist

      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: dist/*

  publish:
    # workflow_dispatch 只做构建验证，不发布；真正的发布只由 tag 触发。
    if: startsWith(github.ref, 'refs/tags/')
    needs: [linux, macos, windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Flatten
        run: |
          mkdir -p out
          find artifacts -type f -exec cp {} out/ \;
          ls -l out
      - uses: softprops/action-gh-release@v3
        with:
          files: out/*
          generate_release_notes: true
